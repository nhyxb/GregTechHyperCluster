name: Release

# Tag-driven release pipeline. A tag push (v*) runs the exact same gates as the
# merge-gate `validate` job, plus the Xvfb client smoke, and only then publishes
# a GitHub Release with the main JAR and its SHA256SUMS.txt.
#
# Everything that pipes Gradle through `tee` declares `shell: bash` with
# `set -o pipefail` — see ci.yml for the full story (GitHub's default
# `bash -e {0}` reports the LAST command's status, so `| tee` turns a failing
# build into a green run).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Read mod_version from gradle.properties
        id: version
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ -z "$mod_version" ]; then
            echo "::error::Could not read mod_version from gradle.properties."
            exit 1
          fi
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version"

      # Gate 0: the tag must match the version the tree actually builds.
      # A mismatch here means the tag was cut from the wrong commit or the
      # version bump never happened — fail before burning a full run.
      - name: Verify tag matches mod_version
        run: |
          set -euo pipefail
          mod_version="${{ steps.version.outputs.mod_version }}"
          expected="v${mod_version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag/ref mismatch: GITHUB_REF_NAME='$GITHUB_REF_NAME' but gradle.properties builds '$expected'."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches mod_version $mod_version."

      - name: Prepare log directory
        run: mkdir -p ci-logs

      # ---------------------------------------------------------------------
      # 1. Generate, then verify the result is committed (same as ci.yml).
      # ---------------------------------------------------------------------
      - name: Generate data (runData)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace runData 2>&1 | tee ci-logs/gradle-rundata.log

      - name: Fail if generated resources are not committed
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all -- src/generated/resources)"
          if [ -n "$drift" ]; then
            echo "::error::src/generated/resources is out of date — run ./gradlew runData and commit the result."
            echo "--- git status ---"
            echo "$drift"
            echo "--- diff ---"
            git --no-pager diff -- src/generated/resources || true
            echo "--- untracked ---"
            git ls-files --others --exclude-standard -- src/generated/resources || true
            exit 1
          fi
          echo "Generated resources match the committed tree ($(git ls-files src/generated/resources | wc -l) files)."

      # ---------------------------------------------------------------------
      # 2. Style, then package — two independent invocations, then checksums.
      # ---------------------------------------------------------------------
      - name: Check formatting (spotlessCheck)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace spotlessCheck 2>&1 | tee ci-logs/gradle-spotless.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace build 2>&1 | tee ci-logs/gradle-build.log

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          mod_version="${{ steps.version.outputs.mod_version }}"
          jar="build/libs/gregtech-hypercluster-${mod_version}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Expected release JAR is missing: $jar"
            ls -l build/libs/ || true
            exit 1
          fi
          cd build/libs
          sha256sum "gregtech-hypercluster-${mod_version}.jar" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "### JAR" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 3. GameTest on a brand-new flat world (same as ci.yml).
      # ---------------------------------------------------------------------
      - name: Initialise a fresh GameTest world
        run: |
          set -euo pipefail
          rm -rf run/gametest
          mkdir -p run/gametest
          # level-type is the load-bearing line (see README / MEMORY.md): the
          # arena lives at y=-60 and a normal world would bury it in stone.
          cat > run/gametest/server.properties <<'PROPERTIES'
          level-type=minecraft\:flat
          level-seed=
          online-mode=false
          enforce-secure-profile=false
          sync-chunk-writes=false
          view-distance=10
          PROPERTIES
          printf 'eula=true\n' > run/gametest/eula.txt
          echo '--- run/gametest/server.properties ---'
          cat run/gametest/server.properties

      - name: Run GameTest
        id: gametest
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --stacktrace runGametest 2>&1 | tee ci-logs/gradle-gametest.log
          status=${PIPESTATUS[0]}
          echo "gradle_exit=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Verify the GameTest summary
        if: steps.gametest.outcome == 'success' || steps.gametest.outcome == 'failure'
        run: |
          set -uo pipefail
          LOG=run/gametest/logs/latest.log
          GRADLE_LOG=ci-logs/gradle-gametest.log
          logs=()
          [ -f "$LOG" ] && logs+=("$LOG")
          [ -f "$GRADLE_LOG" ] && logs+=("$GRADLE_LOG")
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "::error::No GameTest log was produced — the harness never started."
            exit 1
          fi
          # Timestamps are locale-dependent; every pattern anchors on message text.
          complete=0; passed=0; failed=0; ran=0
          for f in "${logs[@]}"; do
            grep -q 'GAME TESTS COMPLETE' "$f" && complete=1
            grep -qE 'All [0-9]+ required tests passed' "$f" && passed=1
            grep -qE '[0-9]+ required tests? failed' "$f" && failed=1
            grep -q 'GameTestBatchRunner' "$f" && ran=1
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::The GameTest server started but never ran a batch."
            exit 1
          fi
          if [ "$complete" -eq 0 ]; then
            echo "::error::No 'GAME TESTS COMPLETE' summary — the server exited without finishing the suite."
            exit 1
          fi
          if [ "$failed" -ne 0 ] || [ "$passed" -eq 0 ]; then
            echo "::error::The suite reported failures. Failing tests:"
            grep -hE 'failed!|required tests? failed|^[[:space:]]+- ' "${logs[@]}" ci-logs/*.log 2>/dev/null \
              | sort -u | head -50 || true
            exit 1
          fi
          count="$(grep -hoE 'All [0-9]+ required tests passed' "${logs[@]}" 2>/dev/null \
                   | grep -oE '[0-9]+' | sort -u | head -1)"
          echo "GameTest: ${count:-?} required tests passed."
          {
            echo "### GameTest"
            echo "**${count:-?}** required tests passed."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 4. Xvfb client smoke — a release must also boot to the main menu.
      # ---------------------------------------------------------------------
      - name: Install Xvfb and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb imagemagick

      - name: Boot the client under Xvfb
        shell: bash
        run: |
          set -o pipefail
          bash .github/scripts/client-smoke.sh ci-logs/client-smoke 2>&1 | tee ci-logs/gradle-client-smoke.log

      # ---------------------------------------------------------------------
      # 5. Publish — only reached when every gate above is green.
      #    Pre-release when the tag is v0.* or carries a hyphen (-alpha/-beta/-rc…).
      # ---------------------------------------------------------------------
      - name: Decide pre-release status
        id: prerelease
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == v0.* || "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag is treated as a pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag is a stable release."
          fi

      - name: Collect release notes
        run: |
          set -euo pipefail
          file=".github/release-body.md"
          {
            echo "GregTech HyperCluster $GITHUB_REF_NAME"
            echo
            echo "Built and verified by the Release workflow: runData drift check, spotlessCheck, build, fresh-world GameTest and the Xvfb client smoke all passed for this exact commit."
            echo
            echo "- Main JAR: \`gregtech-hypercluster-${{ steps.version.outputs.mod_version }}.jar\` (attached)"
            echo "- Checksums: \`SHA256SUMS.txt\` (attached)"
          } > "$file"
          report="docs/reports/${{ steps.version.outputs.mod_version }}_acceptance_report.md"
          if [ -f "$report" ]; then
            {
              echo
              echo "Acceptance report: [docs/reports/${{ steps.version.outputs.mod_version }}_acceptance_report.md](https://github.com/${GITHUB_REPOSITORY}/blob/$GITHUB_SHA/$report)"
            } >> "$file"
          fi
          echo '--- release body ---'
          cat "$file"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mod_version="${{ steps.version.outputs.mod_version }}"
          # --verify-tag: the tag must already exist on the remote (it does —
          # this run was triggered by its push); no accidental tag from main.
          args=(create --verify-tag)
          args+=(--title "GregTech HyperCluster $GITHUB_REF_NAME")
          args+=(--notes-file .github/release-body.md)
          # Auto-generated release notes (commit list + changelog link) on top
          # of the curated body above; disable by removing this line.
          args+=(--generate-notes)
          if [ "${{ steps.prerelease.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          args+=("$GITHUB_REF_NAME")
          args+=("build/libs/gregtech-hypercluster-${mod_version}.jar")
          args+=("build/libs/SHA256SUMS.txt")
          gh release "${args[@]}"

      # Diagnostics survive a failure.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-logs
          path: |
            ci-logs/**
            run/gametest/logs/**
            run/gametest/crash-reports/**
            run/data/logs/**
          if-no-files-found: warn
          retention-days: 14
