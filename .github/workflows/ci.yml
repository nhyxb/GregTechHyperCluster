name: CI

# One pipeline, two audiences:
#   validate     — the merge gate: PRs and every push to main run the same steps.
#   client-smoke — the Xvfb client run, kept manual so it never gates a merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older verification. Pushes to main are
# never cancelled: that run produces the JAR we may later publish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home (~/.gradle): dependency jars, the wrapper
      # distribution and build-cache/transform results. The run worlds under run/
      # are NOT cached — every round starts from an empty machine room.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare log directory
        run: mkdir -p ci-logs

      # ---------------------------------------------------------------------
      # 1. Generate, then verify the result is committed.
      #    runData and build are deliberately two separate invocations: a single
      #    call can package whatever generated resources happened to be on disk
      #    before the generator ran (seen during 0.6.2 acceptance).
      # ---------------------------------------------------------------------
      - name: Generate data (runData)
        run: ./gradlew --stacktrace runData 2>&1 | tee ci-logs/gradle-rundata.log

      - name: Fail if generated resources are not committed
        run: |
          set -euo pipefail
          # Tracked edits AND new files; .cache stays ignored via .gitignore.
          drift="$(git status --porcelain --untracked-files=all -- src/generated/resources)"
          if [ -n "$drift" ]; then
            echo "::error::src/generated/resources is out of date — run ./gradlew runData and commit the result."
            echo "--- git status ---"
            echo "$drift"
            echo "--- diff ---"
            git --no-pager diff -- src/generated/resources || true
            echo "--- untracked ---"
            git ls-files --others --exclude-standard -- src/generated/resources || true
            exit 1
          fi
          echo "Generated resources match the committed tree ($(git ls-files src/generated/resources | wc -l) files)."

      # ---------------------------------------------------------------------
      # 2. Style, then package — a second, independent invocation.
      # ---------------------------------------------------------------------
      - name: Check formatting (spotlessCheck)
        run: ./gradlew --stacktrace spotlessCheck 2>&1 | tee ci-logs/gradle-spotless.log

      - name: Build
        run: ./gradlew --stacktrace build 2>&1 | tee ci-logs/gradle-build.log

      - name: Report build artifacts
        run: |
          set -euo pipefail
          ls -l build/libs/*.jar
          for jar in build/libs/*.jar; do
            sha256sum "$jar" | tee -a ci-logs/jar-sha256.txt
          done
          {
            echo '### JAR'
            echo '```'
            cat ci-logs/jar-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 3. GameTest on a brand-new flat world.
      #    The arena lives at y=-60, so a default (normal) world grows terrain
      #    above it and breaks the open-sky checks. run/ is gitignored and not
      #    cached, so this directory is created fresh every round.
      # ---------------------------------------------------------------------
      - name: Initialise a fresh GameTest world
        run: |
          set -euo pipefail
          rm -rf run/gametest
          mkdir -p run/gametest
          # level-type is the load-bearing line (see README / MEMORY.md).
          cat > run/gametest/server.properties <<'PROPERTIES'
          level-type=minecraft\:flat
          level-seed=
          online-mode=false
          enforce-secure-profile=false
          sync-chunk-writes=false
          view-distance=10
          PROPERTIES
          # run/ is not committed, so the maintainer's EULA acceptance (recorded in
          # README.md) has to be materialised here or the server stops at the prompt.
          printf 'eula=true\n' > run/gametest/eula.txt
          echo '--- run/gametest/server.properties ---'
          cat run/gametest/server.properties

      - name: Run GameTest
        id: gametest
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --stacktrace runGametest 2>&1 | tee ci-logs/gradle-gametest.log
          # PIPESTATUS must be read before any other command overwrites it.
          status=${PIPESTATUS[0]}
          echo "gradle_exit=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      # Exit code alone is not proof: a server that never ran a test still exits 0.
      - name: Verify the GameTest summary
        if: always()
        run: |
          set -uo pipefail
          LOG=run/gametest/logs/latest.log
          GRADLE_LOG=ci-logs/gradle-gametest.log
          # Belt and braces: the harness summary lands in latest.log, but fall back
          # to the console log so a log-path change cannot become a false pass.
          logs=()
          [ -f "$LOG" ] && logs+=("$LOG")
          [ -f "$GRADLE_LOG" ] && logs+=("$GRADLE_LOG")
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "::error::No GameTest log was produced — the harness never started."
            exit 1
          fi
          # Timestamps are locale-dependent ([28Nov2026 …] vs [2811月2026 …]), so
          # every pattern below is anchored on the message text only.
          complete=0; passed=0; failed=0; ran=0
          for f in "${logs[@]}"; do
            grep -q 'GAME TESTS COMPLETE' "$f" && complete=1
            grep -qE 'All [0-9]+ required tests passed' "$f" && passed=1
            grep -qE '[0-9]+ required tests? failed' "$f" && failed=1
            grep -q 'GameTestBatchRunner' "$f" && ran=1
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::The GameTest server started but never ran a batch."
            exit 1
          fi
          if [ "$complete" -eq 0 ]; then
            echo "::error::No 'GAME TESTS COMPLETE' summary — the server exited without finishing the suite."
            exit 1
          fi
          if [ "$failed" -ne 0 ] || [ "$passed" -eq 0 ]; then
            echo "::error::The suite reported failures. Failing tests:"
            grep -hE 'failed!|required tests? failed|^[[:space:]]+- ' "${logs[@]}" ci-logs/*.log 2>/dev/null \
              | sort -u | head -50 || true
            exit 1
          fi
          # Read the count out of the log so new cases need no workflow edit.
          count="$(grep -hoE 'All [0-9]+ required tests passed' "${logs[@]}" 2>/dev/null \
                   | grep -oE '[0-9]+' | sort -u | head -1)"
          echo "GameTest: ${count:-?} required tests passed."
          {
            echo "### GameTest"
            echo "**${count:-?}** required tests passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: gregtech-hypercluster-jar
          path: |
            build/libs/*.jar
            ci-logs/jar-sha256.txt
          if-no-files-found: error
          retention-days: 30

      # Diagnostics survive a failure: the whole Gradle console, the game logs
      # and any crash report the harness wrote.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-failure-logs
          path: |
            ci-logs/**
            run/gametest/logs/**
            run/gametest/crash-reports/**
            run/data/logs/**
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Manual only: proves the client actually boots with the mod loaded.
  # Not a merge gate — a real GL context is slow and occasionally flaky.
  # ---------------------------------------------------------------------------
  client-smoke:
    name: client-smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Xvfb and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils imagemagick

      - name: Boot the client under Xvfb
        run: |
          set -uo pipefail
          mkdir -p ci-logs run/validation
          SHOT=run/validation/main-menu-ci.png
          LOG=ci-logs/client.log

          Xvfb :99 -screen 0 1280x720x24 > ci-logs/xvfb.log 2>&1 &
          XVFB_PID=$!
          for _ in $(seq 1 80); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.25; done
          if [ ! -e /tmp/.X11-unix/X99 ]; then
            echo "::error::Xvfb never came up"; tail -20 ci-logs/xvfb.log; kill -9 "$XVFB_PID"; exit 1
          fi

          cleanup() {
            kill -TERM "$CLIENT_PGID" 2>/dev/null
            sleep 5
            kill -KILL "$CLIENT_PGID" 2>/dev/null
            pkill -KILL -f 'net.minecraftforge' 2>/dev/null
            pkill -KILL -f 'GradleWrapperMain' 2>/dev/null
            kill -TERM "$XVFB_PID" 2>/dev/null; sleep 2; kill -KILL "$XVFB_PID" 2>/dev/null
            echo '--- leftover processes ---'
            pgrep -a Xvfb | grep -v pgrep || echo 'no Xvfb left'
            pgrep -a java | grep -v pgrep || echo 'no java left'
          }

          setsid env -u WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE=1 DISPLAY=:99 \
            ./gradlew runClient > "$LOG" 2>&1 &
          CLIENT_PGID=$!
          trap cleanup EXIT INT TERM

          # "Sound engine started" is the first reliable post-init marker.
          REACHED=no
          for _ in $(seq 1 200); do
            if grep -q 'Sound engine started' "$LOG" 2>/dev/null; then REACHED=yes; break; fi
            kill -0 "$CLIENT_PGID" 2>/dev/null || { echo 'client exited early'; break; }
            sleep 3
          done
          echo "MAIN_MENU_REACHED=$REACHED"
          [ "$REACHED" = yes ] || { echo '::error::Client never reached the main menu'; exit 1; }

          sleep 45   # let the title screen draw and late resource errors surface
          DISPLAY=:99 import -window root "$SHOT" 2>/dev/null \
            && identify -format 'shot %wx%h mean=%[mean]\n' "$SHOT" \
            || { echo '::error::Screenshot failed'; exit 1; }

          cp -f run/client/logs/latest.log ci-logs/client-latest.log 2>/dev/null || true

          # Content errors only: the narrator notice appears on every platform
          # without a native speech library and is not ours.
          if [ -f ci-logs/client-latest.log ]; then
            if grep '/ERROR]' ci-logs/client-latest.log \
                 | grep -viE 'text2speech|Narrator' | grep -q .; then
              echo '::error::Content errors in the client log:'
              grep '/ERROR]' ci-logs/client-latest.log | grep -viE 'text2speech|Narrator' | head -30
              exit 1
            fi
            echo 'Client log clean (only the known narrator notice).'
          fi

      - name: Upload client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-evidence
          path: |
            ci-logs/**
            run/validation/main-menu-ci.png
          if-no-files-found: warn
          retention-days: 14
